<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

</head>
<body>

<h2>Registro de Pedido</h2>
<form method="post" th:action="@{'/guardarPedido'}">
    <div class="form-group">
        <label >Nombre del cliente</label>
        <input name="nombreCliente" type="text" class="form-control" id="nombreCliente">
    </div>
    <div class="form-group">
        <label >Tipo de Servicio</label>

        <select id="servicio" name="servicio" class="form-select">
            <option value="" selected disabled>-- Elija un servicio --</option>
            <option th:each="dept, info : ${tipos}"
                    th:value="${info.index+1}"
                    th:text="${info.index+1}"></option>
        </select>
        <!--        <input th:value="${employee.department.departmentname}" name="departmentname" type="text" class="form-control" id="departmentname" >-->
    </div>



    <a th:href="@{'/historialPedidos'}" class="btn btn-danger">Ir al historial</a>
    <button type="submit" class="btn btn-primary">Crear Pedido</button>

</form>

</body>
</html>
